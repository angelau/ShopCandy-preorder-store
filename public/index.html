<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCandy - Exclusive Preorders & Stock</title>
    <meta property="og:title" content="ShopCandy Preorder Store">
    <meta property="og:description" content="Reserve the latest trendy products before they arrive.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="/" class="logo">ShopCandy</a>
        <button class="cart-btn" onclick="toggleCart(true)">
            Cart <span class="cart-badge" id="cartCount">0</span>
        </button>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <h1>Reserve Next Season's Candy Today 🍬</h1>
        <p>Preorder new arrivals before stock runs out, or shop instantly available items.</p>
    </section>

    <!-- Filter Categories -->
    <div class="filters" id="categoryFilters">
        <button class="filter-btn active" onclick="filterCategory('all')">All Products</button>
        <button class="filter-btn" onclick="filterCategory('preorder')">⏳ Preorders</button>
        <button class="filter-btn" onclick="filterCategory('in_stock')">⚡ In Stock</button>
    </div>

    <!-- Product Grid Container -->
    <main class="container">
        <div class="product-grid" id="productGrid">
            <p style="grid-column: 1/-1; text-align: center; color: var(--gray);">Loading products...</p>
        </div>
    </main>

    <!-- Cart Drawer & Checkout Form -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCart(false)"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h2>Your Cart</h2>
            <button class="close-btn" onclick="toggleCart(false)">&times;</button>
        </div>

        <div class="drawer-body" id="cartItems">
            <p style="text-align: center; color: var(--gray); margin-top: 2rem;">Your cart is currently empty.</p>
        </div>

        <div class="drawer-footer" id="cartFooter" style="display: none;">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cartSubtotal">₦0</span>
            </div>
            
            <form id="checkoutForm" onsubmit="handleCheckout(event)" style="margin-top: 1rem;">
                <input type="text" id="custName" placeholder="Full Name *" required style="width: 100%; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #ccc; border-radius: 6px;">
                <input type="tel" id="custPhone" placeholder="WhatsApp Phone Number *" required style="width: 100%; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #ccc; border-radius: 6px;">
                <input type="email" id="custEmail" placeholder="Email Address (Optional)" style="width: 100%; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #ccc; border-radius: 6px;">
                <textarea id="custAddress" placeholder="Delivery Address *" required style="width: 100%; padding: 0.6rem; margin-bottom: 0.8rem; border: 1px solid #ccc; border-radius: 6px;" rows="2"></textarea>
                
                <button type="submit" class="btn-primary" id="checkoutBtn">Preorder via WhatsApp 🚀</button>
            </form>
        </div>
    </div>

    <!-- Floating WhatsApp Contact Button -->
    <a href="https://wa.me/2348163807873" target="_blank" class="whatsapp-float" title="Contact Us on WhatsApp">💬</a>

    <script src="/js/main.js"></script>
</body>
</html>
