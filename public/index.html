<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCandy - Exclusive Preorders & Stock</title>
    <meta property="og:title" content="ShopCandy Preorder Store">
    <meta property="og:description" content="Reserve the latest trendy products before they arrive.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="/" class="logo">ShopCandy</a>
        <button type="button" class="cart-btn" onclick="toggleCart(true)">
            Cart <span class="cart-badge" id="cartCount">0</span>
        </button>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <h1>Reserve Next Season's Candy Today 🍬</h1>
        <p>Preorder new arrivals before stock runs out, or shop instantly available items.</p>
    </section>

    <!-- Main Container -->
    <main class="container">
        <!-- Category Filter Tabs Container (Single Unique ID) -->
        <div id="categoryFilters" class="category-filters-container" style="display: flex; gap: 0.5rem; overflow-x: auto; padding: 1rem 0; margin-bottom: 1.5rem;">
            <!-- Generated dynamically by main.js -->
        </div>

        <!-- Product Grid Container -->
        <div class="product-grid" id="productGrid">
            <p style="grid-column: 1/-1; text-align: center; color: var(--gray);">Loading products...</p>
        </div>
    </main>

    <!-- Cart Drawer & Checkout Form -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCart(false)"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h2>Your Cart</h2>
            <button type="button" class="close-btn" onclick="toggleCart(false)">&times;</button>
        </div>

        <div class="drawer-body" id="cartItems">
            <p style="text-align: center; color: var(--gray); margin-top: 2rem;">Your cart is currently empty.</p>
        </div>

        <div class="drawer-footer" id="cartFooter" style="display: none;">
            <div class="summary-row" style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 1rem;">
                <span>Subtotal</span>
                <span id="cartSubtotal">₦0</span>
            </div>
            
            <form id="checkoutForm" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label for="custName">Full Name</label>
                    <input type="text" id="custName" required placeholder="Jane Doe">
                </div>

                <div class="form-group">
                    <label for="custPhone">Phone Number</label>
                    <input type="tel" id="custPhone" required placeholder="08012345678">
                </div>

                <div class="form-group">
                    <label for="custEmail">Email Address</label>
                    <input type="email" id="custEmail" required placeholder="jane@example.com">
                </div>

                <div class="form-group">
                    <label for="custAddress">Delivery Address</label>
                    <textarea id="custAddress" required placeholder="Enter delivery address"></textarea>
                </div>

                <button type="submit" id="checkoutBtn" class="btn-primary" style="width: 100%; margin-top: 1rem;">
                    Preorder via WhatsApp 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Floating WhatsApp Contact Button -->
    <a href="https://wa.me/2348163807873" target="_blank" class="whatsapp-float" title="Contact Us on WhatsApp">💬</a>

    <!-- Absolute script reference to avoid sub-route pathing issues -->
    <script src="/js/main.js"></script>
</body>
</html>
