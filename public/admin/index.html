<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCandy Admin Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-nav { display: flex; gap: 1rem; border-bottom: 2px solid #e4e4e7; margin-bottom: 1.5rem; }
        .tab-btn { padding: 0.75rem 1.25rem; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--gray); border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .admin-card { background: white; border: 1px solid #e4e4e7; border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.6rem; border: 1px solid #d4d4d8; border-radius: 6px; font-size: 0.95rem;
        }

        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th, .data-table td { padding: 0.75rem; border-bottom: 1px solid #e4e4e7; font-size: 0.9rem; }
        .data-table th { background: #fafafa; font-weight: 600; }
        
        .status-pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-pill.preorder { background: #f3e8ff; color: #7e22ce; }
        .status-pill.in_stock { background: #d1fae5; color: #047857; }
        
        .action-btn { padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
        .btn-edit { background: #e0f2fe; color: #0369a1; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <header>
        <a href="/admin/index.html" class="logo">ShopCandy Admin</a>
        <a href="/" target="_blank" style="text-decoration: none; font-size: 0.9rem; font-weight: 600; color: var(--gray);">View Storefront ↗</a>
    </header>

    <main class="container" style="margin-top: 1.5rem;">

        <!-- Navigation Tabs -->
        <nav class="admin-nav">
            <button class="tab-btn active" onclick="switchTab('products')">Products</button>
            <button class="tab-btn" onclick="switchTab('orders')">Orders</button>
        </nav>

        <!-- PRODUCTS TAB -->
        <section id="tabProducts">
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem;">
                
                <!-- Product Form -->
                <div class="admin-card">
                    <h3 id="formTitle" style="margin-bottom: 1rem;">Add New Product</h3>
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="prodId">
                        
                        <div class="form-group">
                            <label for="prodName">Product Name *</label>
                            <input type="text" id="prodName" required placeholder="e.g. Vintage Leather Bag">
                        </div>

                        <div class="form-group">
                            <label for="prodPrice">Price (₦) *</label>
                            <input type="number" id="prodPrice" required placeholder="e.g. 25000">
                        </div>

                        <div class="form-group">
                            <label for="prodStatus">Availability Status *</label>
                            <select id="prodStatus" required>
                                <option value="preorder">⏳ Preorder</option>
                                <option value="in_stock">⚡ In Stock</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prodImage">Image URL</label>
                            <input type="url" id="prodImage" placeholder="https://res.cloudinary.com/...">
                        </div>

                        <div class="form-group">
                            <label for="prodDesc">Description</label>
                            <textarea id="prodDesc" rows="3" placeholder="Brief item details..."></textarea>
                        </div>

                        <button type="submit" class="btn-primary" id="saveProdBtn">Save Product</button>
                        <button type="button" onclick="resetProductForm()" style="width: 100%; margin-top: 0.5rem; background: none; border: none; color: var(--gray); cursor: pointer;">Cancel / Clear</button>
                    </form>
                </div>

                <!-- Product Inventory Table -->
                <div class="admin-card" style="overflow-x: auto;">
                    <h3 style="margin-bottom: 1rem;">Inventory</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable">
                            <tr><td colspan="4" style="text-align: center; color: var(--gray);">Loading items...</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </section>

        <!-- ORDERS TAB -->
        <section id="tabOrders" style="display: none;">
            <div class="admin-card" style="overflow-x: auto;">
                <h3 style="margin-bottom: 1rem;">Customer Orders</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Delivery Address</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr><td colspan="5" style="text-align: center; color: var(--gray);">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="/admin/admin.js"></script>
</body>
</html>
